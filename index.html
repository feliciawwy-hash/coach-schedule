<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教练预约系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .coach-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .coach-tab {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .coach-tab:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .coach-tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .date-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .date-selector label {
            font-weight: 600;
            color: #333;
        }
        
        .date-selector input[type="date"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .date-selector input[type="date"]:focus {
            border-color: #667eea;
        }
        
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .legend-box.available { background: #e8f5e9; border: 2px solid #4caf50; }
        .legend-box.off { background: #ffebee; border: 2px solid #f44336; }
        .legend-box.booked { background: #fff3e0; border: 2px solid #ff9800; }
        .legend-box.selected { background: #667eea; border: 2px solid #667eea; }
        
        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
        }
        
        .time-label {
            font-weight: 600;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        
        .date-header {
            text-align: center;
            padding: 12px 8px;
            background: #f5f5f5;
            border-radius: 10px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        
        .date-header .day-name {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }
        
        .slot {
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slot.available {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }
        
        .slot.available:hover {
            background: #c8e6c9;
            transform: scale(1.05);
        }
        
        .slot.off {
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .slot.booked {
            background: #fff3e0;
            border: 2px solid #ff9800;
            color: #ef6c00;
            cursor: not-allowed;
        }
        
        .slot.selected {
            background: #667eea;
            border: 2px solid #667eea;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .booking-form {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .booking-form h3 {
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }
        
        .selected-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .selected-slot-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .selected-slot-tag .remove {
            cursor: pointer;
            opacity: 0.8;
        }
        
        .selected-slot-tag .remove:hover {
            opacity: 1;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        
        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        
        .status-message.loading {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .schedule-grid {
                grid-template-columns: 60px repeat(7, minmax(60px, 1fr));
                font-size: 0.8rem;
            }
            
            .slot {
                padding: 8px 4px;
                font-size: 0.75rem;
                min-height: 40px;
            }
            
            .main-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏸 教练预约系统</h1>
            <p>选择教练、日期和时段，提交预约申请</p>
        </header>
        
        <div class="coach-tabs">
            <button class="coach-tab active" data-coach="che">Che</button>
            <button class="coach-tab" data-coach="roby">Roby</button>
            <button class="coach-tab" data-coach="judy">Judy</button>
            <button class="coach-tab" data-coach="elizabeth">Elizabeth</button>
        </div>
        
        <div class="main-card">
            <div class="date-selector">
                <label>📅 选择日期：</label>
                <input type="date" id="dateInput">
                <span style="color: #666; font-size: 0.9rem;">（默认显示本周）</span>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box available"></div>
                    <span>可预约</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box off"></div>
                    <span>OFF / 不可用</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box booked"></div>
                    <span>已被预约</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box selected"></div>
                    <span>已选择</span>
                </div>
            </div>
            
            <div id="scheduleContainer">
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="booking-form">
                <h3>📝 预约信息</h3>
                <div class="form-group">
                    <label>您的姓名 *</label>
                    <input type="text" id="nameInput" placeholder="请输入您的姓名" required>
                </div>
                <div class="form-group">
                    <label>联系电话（可选）</label>
                    <input type="tel" id="phoneInput" placeholder="方便教练联系您">
                </div>
                <div class="form-group">
                    <label>备注（可选）</label>
                    <input type="text" id="noteInput" placeholder="如：首次上课 / 需要球拍等">
                </div>
                <div class="form-group">
                    <label>已选时段</label>
                    <div class="selected-slots" id="selectedSlots">
                        <span style="color: #999; font-size: 0.9rem;">请在上方选择时段</span>
                    </div>
                </div>
                <button class="btn-submit" id="submitBtn" disabled>
                    提交预约申请
                </button>
                <div class="status-message" id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const COACHES = {
            che: { name: 'Che', sheetId: '6wqv7g', baseRow: 3 },
            roby: { name: 'Roby', sheetId: 'roby_sheet', baseRow: 4 },
            judy: { name: 'Judy', sheetId: 'judy_sheet', baseRow: 3 },
            elizabeth: { name: 'Elizabeth', sheetId: 'elizabeth_sheet', baseRow: 4 }
        };
        
        const TIME_SLOTS = [
            '8:00', '8:30', '9:00', '9:30', '10:00', '10:30', '11:00', '11:30',
            '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30',
            '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30',
            '20:00', '20:30', '21:00', '21:30', '22:00', '22:30'
        ];
        
        // 状态
        let currentCoach = 'che';
        let currentWeekStart = getWeekStart(new Date());
        let selectedSlots = [];
        let scheduleData = {};
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initDateInput();
            initCoachTabs();
            loadSchedule();
            initForm();
        });
        
        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }
        
        function initDateInput() {
            const input = document.getElementById('dateInput');
            input.valueAsDate = currentWeekStart;
            input.addEventListener('change', (e) => {
                currentWeekStart = getWeekStart(new Date(e.target.value));
                loadSchedule();
            });
        }
        
        function initCoachTabs() {
            const tabs = document.querySelectorAll('.coach-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCoach = tab.dataset.coach;
                    selectedSlots = [];
                    updateSelectedSlotsDisplay();
                    loadSchedule();
                });
            });
        }
        
        function getWeekDates() {
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(currentWeekStart);
                date.setDate(date.getDate() + i);
                dates.push(date);
            }
            return dates;
        }
        
        function formatDate(date) {
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }
        
        function getDayName(index) {
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            return days[index];
        }
        
        // 模拟加载数据（实际部署后替换为真实API）
        async function loadSchedule() {
            const grid = document.getElementById('scheduleGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;"><div class="loading-spinner"></div> 加载中...</div>';
            
            // 模拟API延迟
            await new Promise(r => setTimeout(r, 500));
            
            // 模拟数据生成（实际应从云函数获取）
            generateMockData();
            renderSchedule();
        }
        
        function generateMockData() {
            // 模拟：随机一些OFF和已预约
            scheduleData = {};
            const dates = getWeekDates();
            
            dates.forEach((date, dateIndex) => {
                const dateKey = formatDate(date);
                scheduleData[dateKey] = {};
                
                TIME_SLOTS.forEach(time => {
                    const rand = Math.random();
                    if (rand < 0.15) {
                        scheduleData[dateKey][time] = 'off';
                    } else if (rand < 0.3) {
                        scheduleData[dateKey][time] = 'booked';
                    } else {
                        scheduleData[dateKey][time] = 'available';
                    }
                });
            });
        }
        
        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            const dates = getWeekDates();
            
            let html = '<div></div>'; // 左上角空白
            
            // 日期表头
            dates.forEach((date, index) => {
                const dateStr = formatDate(date);
                const dayName = getDayName(index);
                const isToday = new Date().toDateString() === date.toDateString();
                html += `
                    <div class="date-header" style="${isToday ? 'background: #667eea; color: white;' : ''}">
                        ${dateStr}
                        <div class="day-name">${dayName}${isToday ? ' (今天)' : ''}</div>
                    </div>
                `;
            });
            
            // 时间行
            TIME_SLOTS.forEach(time => {
                html += `<div class="time-label">${time}</div>`;
                
                dates.forEach(date => {
                    const dateKey = formatDate(date);
                    const status = scheduleData[dateKey]?.[time] || 'available';
                    const isSelected = selectedSlots.some(s => 
                        s.date === dateKey && s.time === time
                    );
                    
                    const slotClass = isSelected ? 'selected' : status;
                    const displayText = status === 'booked' ? '已预约' : 
                                       status === 'off' ? 'OFF' : '可预约';
                    
                    html += `
                        <div class="slot ${slotClass}" 
                             data-date="${dateKey}" 
                             data-time="${time}"
                             onclick="handleSlotClick('${dateKey}', '${time}', '${status}')">
                            ${displayText}
                        </div>
                    `;
                });
            });
            
            grid.innerHTML = html;
        }
        
        function handleSlotClick(date, time, status) {
            if (status === 'off' || status === 'booked') {
                return; // 不可选
            }
            
            const existingIndex = selectedSlots.findIndex(s => 
                s.date === date && s.time === time
            );
            
            if (existingIndex >= 0) {
                selectedSlots.splice(existingIndex, 1);
            } else {
                // 限制最多选4个时段
                if (selectedSlots.length >= 4) {
                    showStatus('最多只能选择4个连续时段', 'error');
                    return;
                }
                selectedSlots.push({ date, time, coach: currentCoach });
            }
            
            updateSelectedSlotsDisplay();
            renderSchedule();
        }
        
        function updateSelectedSlotsDisplay() {
            const container = document.getElementById('selectedSlots');
            const submitBtn = document.getElementById('submitBtn');
            
            if (selectedSlots.length === 0) {
                container.innerHTML = '<span style="color: #999; font-size: 0.9rem;">请在上方选择时段</span>';
                submitBtn.disabled = true;
                return;
            }
            
            // 按时间排序
            selectedSlots.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return TIME_SLOTS.indexOf(a.time) - TIME_SLOTS.indexOf(b.time);
            });
            
            container.innerHTML = selectedSlots.map((slot, index) => `
                <div class="selected-slot-tag">
                    ${COACHES[slot.coach].name} ${slot.date} ${slot.time}
                    <span class="remove" onclick="removeSlot(${index})">×</span>
                </div>
            `).join('');
            
            submitBtn.disabled = false;
        }
        
        function removeSlot(index) {
            selectedSlots.splice(index, 1);
            updateSelectedSlotsDisplay();
            renderSchedule();
        }
        
        function initForm() {
            document.getElementById('submitBtn').addEventListener('click', submitBooking);
        }
        
        async function submitBooking() {
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const note = document.getElementById('noteInput').value.trim();
            
            if (!name) {
                showStatus('请输入您的姓名', 'error');
                return;
            }
            
            if (selectedSlots.length === 0) {
                showStatus('请至少选择一个时段', 'error');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            showStatus('正在提交...', 'loading');
            
            // 构建预约数据
            const bookingData = {
                name,
                phone,
                note,
                coach: currentCoach,
                slots: selectedSlots,
                submitTime: new Date().toISOString()
            };
            
            try {
                // 实际部署后调用云函数
                // const result = await fetch('/api/book', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(bookingData)
                // });
                
                // 模拟提交
                await new Promise(r => setTimeout(r, 1500));
                
                showStatus(`预约申请已提交！\n${COACHES[currentCoach].name}教练会尽快确认您的预约。`, 'success');
                
                // 清空表单
                selectedSlots = [];
                updateSelectedSlotsDisplay();
                document.getElementById('nameInput').value = '';
                document.getElementById('phoneInput').value = '';
                document.getElementById('noteInput').value = '';
                renderSchedule();
                
            } catch (error) {
                showStatus('提交失败，请稍后重试', 'error');
                submitBtn.disabled = false;
            }
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            statusEl.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }
        }
    </script>
</body>
</html>
