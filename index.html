<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教练预约系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .coach-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .coach-tab {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .coach-tab:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .coach-tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .manage-coach-btn {
            display: block;
            margin: 0 auto 20px;
            padding: 8px 18px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .manage-coach-btn:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .manage-coach-panel {
            background: rgba(255,255,255,0.97);
            border-radius: 15px;
            padding: 20px;
            margin: 0 auto 25px;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .manage-coach-panel h4 {
            margin-bottom: 12px;
            color: #333;
        }
        
        .manage-coach-panel ul {
            list-style: none;
            margin-bottom: 15px;
        }
        
        .manage-coach-panel li {
            display: block;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        
        .coach-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .coach-name {
            font-weight: 600;
        }
        
        .coach-hours {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: #666;
        }
        
        .coach-hours input[type="time"] {
            padding: 4px 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.82rem;
        }
        
        .del-coach {
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        .add-coach {
            display: flex;
            gap: 8px;
        }
        
        .add-coach input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
        }
        
        .add-coach input:focus {
            border-color: #667eea;
        }
        
        .add-coach button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        
        .manage-coach-panel .hint {
            font-size: 0.78rem;
            color: #999;
            margin-top: 12px;
            line-height: 1.5;
        }
        
        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .date-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .date-selector label {
            font-weight: 600;
            color: #333;
        }
        
        .date-selector input[type="date"] {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .date-selector input[type="date"]:focus {
            border-color: #667eea;
        }
        
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        .legend-box.available { background: #e8f5e9; border: 2px solid #4caf50; }
        .legend-box.off { background: #4a4a4a; border: 2px solid #4a4a4a; }
        .legend-box.booked, .legend-box.pending { background: #fff3e0; border: 2px solid #ff9800; }
        .legend-box.confirmed { background: #d1fae5; border: 2px solid #10b981; }
        .legend-box.cancelled { background: #f0f0f0; border: 2px solid #ccc; }
        .legend-box.selected { background: #667eea; border: 2px solid #667eea; }
        
        .schedule-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            overflow-x: auto;
        }
        
        .time-label {
            font-weight: 600;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        
        .date-header {
            text-align: center;
            padding: 12px 8px;
            background: #f5f5f5;
            border-radius: 10px;
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }
        
        .date-header .day-name {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }
        
        .slot {
            padding: 12px 8px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slot.available {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
        }
        
        .slot.available:hover {
            background: #c8e6c9;
            transform: scale(1.05);
        }
        
        .slot.off {
            background: #4a4a4a;
            border: 2px solid #4a4a4a;
            color: #e0e0e0;
            cursor: not-allowed;
        }
        
        .slot.booked,
        .slot.pending {
            background: #fff3e0;
            border: 2px solid #ff9800;
            color: #ef6c00;
            cursor: not-allowed;
        }

        .slot.confirmed {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
            cursor: not-allowed;
        }

        .slot.cancelled {
            background: #f0f0f0;
            border: 2px solid #ccc;
            color: #999;
            cursor: not-allowed;
        }
        
        .slot.selected {
            background: #667eea;
            border: 2px solid #667eea;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .booking-form {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .booking-form h3 {
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
        }
        
        .selected-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .selected-slot-tag {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .selected-slot-tag .remove {
            cursor: pointer;
            opacity: 0.8;
        }
        
        .selected-slot-tag .remove:hover {
            opacity: 1;
        }
        
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            display: none;
            white-space: pre-line;
        }
        
        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        
        .status-message.loading {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #2196f3;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            
            .schedule-grid {
                grid-template-columns: 60px repeat(7, minmax(60px, 1fr));
                font-size: 0.8rem;
            }
            
            .slot {
                padding: 8px 4px;
                font-size: 0.75rem;
                min-height: 40px;
            }
            
            .main-card {
                padding: 20px;
            }
        }
        .mode-toggle { display:flex; gap:10px; margin: 10px 0 4px; }
        .mode-btn { flex:1; padding:10px; border:1px solid #ddd; background:#fff; border-radius:10px; cursor:pointer; font-size:.95rem; color:#555; }
        .mode-btn.active { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border-color:transparent; }
        .recurring-panel { background:#fafbff; border:1px solid #e3e8ff; border-radius:12px; padding:20px; }
        .weekday-picker { display:flex; gap:6px; flex-wrap:wrap; }
        .weekday-picker button { padding:8px 12px; border:1px solid #ddd; background:#fff; border-radius:8px; cursor:pointer; font-size:.9rem; }
        .weekday-picker button.active { background:#667eea; color:#fff; border-color:transparent; }
        .form-group.row { display:flex; gap:16px; }
        .form-group.row > div { flex:1; }
        .btn-add-rule { width:100%; padding:10px; border:1px dashed #667eea; background:#f5f7ff; color:#667eea; border-radius:10px; cursor:pointer; font-size:.9rem; margin-bottom:10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏸 教练预约系统</h1>
            <p>选择教练、日期和时段，提交预约申请</p>
        </header>
        
        <div class="coach-tabs" id="coachTabs"></div>
        <button class="manage-coach-btn" id="manageCoachBtn">⚙ 管理教练</button>
        <div class="manage-coach-panel" id="manageCoachPanel" style="display:none;">
            <h4>管理教练</h4>
            <ul id="coachList"></ul>
            <div class="add-coach">
                <input type="text" id="newCoachName" placeholder="输入教练名，如 Tom">
                <button id="addCoachBtn">添加</button>
            </div>
            <p class="hint">提示：设置保存在服务器（Cloudflare），换设备也同步。每位教练可设「开放时段」，范围外显示 OFF。</p>
        </div>
        
        <div class="main-card">
            <div class="date-selector">
                <label>📅 选择日期：</label>
                <input type="date" id="dateInput">
                <span style="color: #666; font-size: 0.9rem;">（默认显示本周）</span>
            </div>

            <div class="mode-toggle">
                <button type="button" id="modeSingle" class="mode-btn active" onclick="setMode('single')">单次预约</button>
                <button type="button" id="modeRecur" class="mode-btn" onclick="setMode('recur')">整月循环预约</button>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box available"></div>
                    <span>可预约</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box off"></div>
                    <span>OFF / 不可用</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box pending"></div>
                    <span>待确认</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box confirmed"></div>
                    <span>已确认</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box selected"></div>
                    <span>已选择</span>
                </div>
            </div>
            
            <div id="scheduleContainer">
                <div class="schedule-grid" id="scheduleGrid">
                    <!-- 动态生成 -->
                </div>
            </div>
            
            <div class="booking-form" id="bookingForm">
                <h3>📝 预约信息</h3>
                <div class="form-group">
                    <label>约课名 *</label>
                    <input type="text" id="nameInput" placeholder="请输入约课名" required>
                </div>
                <div class="form-group">
                    <label>已选时段</label>
                    <div class="selected-slots" id="selectedSlots">
                        <span style="color: #999; font-size: 0.9rem;">请在上方选择时段</span>
                    </div>
                </div>
                <button class="btn-submit" id="submitBtn" disabled>
                    提交预约申请
                </button>
                <div class="status-message" id="statusMessage"></div>
            </div>

            <div class="recurring-panel" id="recurringPanel" style="display:none;">
                <h3>🔁 整月循环预约</h3>
                <p class="hint">在上方周视图中点击格子，可选中整个月内所有相同星期+时间的课程。支持选多个不同时段。</p>
                <div class="form-group row">
                    <div><label>月份</label><select id="recurMonth"></select></div>
                </div>
                <div class="status-message" id="recurPreview">请在上方选择时段</div>
                <button class="btn-submit" id="recurSubmitBtn" disabled>提交整月预约</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        // 👇 部署 Cloudflare Worker 后，把下面地址改成你的 Worker 地址（形如 https://xxx.workers.dev）
        const API_BASE = 'https://coach-schedule-api.feliciawwy.workers.dev';

        const TIME_SLOTS = [
            '7:00', '7:30', '8:00', '8:30', '9:00', '9:30', '10:00', '10:30', '11:00', '11:30',
            '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30',
            '16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30',
            '20:00', '20:30', '21:00', '21:30', '22:00', '22:30'
        ];

        // 状态
        let coaches = [];            // [{id,name,openStart,openEnd,sheetId,baseRow}]
        let currentCoachId = null;
        let currentWeekStart = getWeekStart(new Date());
        let selectedSlots = [];      // [{coachId, date(iso), dateLabel, time}]
        let availability = null;      // {coach, days:[{date,iso,slots:{time:status}}]}

        document.addEventListener('DOMContentLoaded', () => {
            initDateInput();
            initManageCoach();
            initForm();
            loadCoaches();
        });

        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function iso(d) {
            return d.toISOString().slice(0, 10);
        }

        function initDateInput() {
            const input = document.getElementById('dateInput');
            input.valueAsDate = currentWeekStart;
            input.addEventListener('change', (e) => {
                currentWeekStart = getWeekStart(new Date(e.target.value));
                loadSchedule();
            });
        }

        async function loadCoaches() {
            try {
                const res = await fetch(API_BASE + '/api/coaches');
                if (!res.ok) throw new Error();
                coaches = await res.json();
            } catch (e) {
                showStatus('⚠️ 无法连接预约服务，请检查 Worker 地址配置（index.html 顶部 API_BASE）', 'error');
                return;
            }
            if (!coaches.length) return;
            if (!coaches.find(c => c.id === currentCoachId)) currentCoachId = coaches[0].id;
            renderCoachTabs();
            renderCoachList();
            loadSchedule();
        }

        function renderCoachTabs() {
            const tabs = document.getElementById('coachTabs');
            tabs.innerHTML = '';
            coaches.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'coach-tab' + (c.id === currentCoachId ? ' active' : '');
                btn.textContent = c.name;
                btn.dataset.coach = c.id;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.coach-tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    currentCoachId = c.id;
                    selectedSlots = [];
                    updateSelectedSlotsDisplay();
                    loadSchedule();
                });
                tabs.appendChild(btn);
            });
        }

        function renderCoachList() {
            const ul = document.getElementById('coachList');
            ul.innerHTML = '';
            coaches.forEach(c => {
                if (!c.openStart) c.openStart = '08:00';
                if (!c.openEnd) c.openEnd = '22:30';

                const li = document.createElement('li');

                const top = document.createElement('div');
                top.className = 'coach-row-top';
                const name = document.createElement('span');
                name.className = 'coach-name';
                name.textContent = c.name;
                const del = document.createElement('button');
                del.className = 'del-coach';
                del.textContent = '删除';
                del.addEventListener('click', async () => {
                    if (coaches.length <= 1) { alert('至少保留一位教练'); return; }
                    if (!confirm(`确定删除教练「${c.name}」？`)) return;
                    await fetch(API_BASE + '/api/coaches/' + c.id, { method: 'DELETE' });
                    if (currentCoachId === c.id) currentCoachId = null;
                    await loadCoaches();
                });
                top.appendChild(name);
                top.appendChild(del);

                const hours = document.createElement('div');
                hours.className = 'coach-hours';
                const lbl = document.createElement('label');
                lbl.textContent = '开放';
                const start = document.createElement('input');
                start.type = 'time';
                start.value = c.openStart;
                const sep = document.createElement('span');
                sep.textContent = '~';
                const end = document.createElement('input');
                end.type = 'time';
                end.value = c.openEnd;
                start.addEventListener('change', () => saveCoach(c.id, { openStart: start.value }));
                end.addEventListener('change', () => saveCoach(c.id, { openEnd: end.value }));
                hours.appendChild(lbl);
                hours.appendChild(start);
                hours.appendChild(sep);
                hours.appendChild(end);

                li.appendChild(top);
                li.appendChild(hours);
                ul.appendChild(li);
            });
        }

        async function saveCoach(id, patch) {
            await fetch(API_BASE + '/api/coaches/' + id, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patch)
            });
            await loadCoaches();
        }

        function initManageCoach() {
            document.getElementById('manageCoachBtn').addEventListener('click', () => {
                const panel = document.getElementById('manageCoachPanel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                if (panel.style.display === 'block') renderCoachList();
            });
            document.getElementById('addCoachBtn').addEventListener('click', async () => {
                const input = document.getElementById('newCoachName');
                const name = input.value.trim();
                if (!name) return;
                await fetch(API_BASE + '/api/coaches', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                input.value = '';
                await loadCoaches();
            });
            document.getElementById('newCoachName').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('addCoachBtn').click();
            });
        }

        function getDayName(index) {
            return ['周一', '周二', '周三', '周四', '周五', '周六', '周日'][index];
        }

        async function loadSchedule() {
            const grid = document.getElementById('scheduleGrid');
            if (!currentCoachId) { grid.innerHTML = ''; return; }
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;"><div class="loading-spinner"></div> 加载中...</div>';
            try {
                const res = await fetch(`${API_BASE}/api/availability?coach=${currentCoachId}&week=${iso(currentWeekStart)}`);
                if (!res.ok) throw new Error();
                availability = await res.json();
                renderSchedule();
            } catch (e) {
                showStatus('⚠️ 加载可约时间失败，请稍后重试', 'error');
                grid.innerHTML = '';
            }
        }

        function renderSchedule() {
            const grid = document.getElementById('scheduleGrid');
            if (!availability || !availability.days || !availability.days.length) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#999;">暂无数据</div>';
                return;
            }
            const days = availability.days;
            let html = '<div></div>';

            days.forEach((d, index) => {
                const isToday = new Date().toDateString() === new Date(d.iso + 'T00:00:00').toDateString();
                html += `
                    <div class="date-header" style="${isToday ? 'background: #667eea; color: white;' : ''}">
                        ${d.date}
                        <div class="day-name">${getDayName(index)}${isToday ? ' (今天)' : ''}</div>
                    </div>
                `;
            });

            TIME_SLOTS.forEach(time => {
                html += `<div class="time-label">${time}</div>`;
                days.forEach((d, dayIndex) => {
                    const status = d.slots[time] || 'off';
                    let isSelected, slotClass, displayText;
                    if(recurringMode){
                        const dow = String(new Date(d.iso + 'T00:00:00').getDay());
                        const sel = selectedSlots.find(s => s.dow === dow && s.time === time);
                        isSelected = !!sel;
                        slotClass = isSelected ? 'selected' : status;
                        const slotsCount = sel ? buildRecurSlotsFromSelected().filter(s => String(new Date(s.date+'T00:00:00').getDay())===dow && s.time===time).length : 0;
                        displayText = isSelected ? `选中 ${slotsCount} 节` : (status === 'available' ? '可预约' : status === 'pending' ? '待确认' : status === 'confirmed' ? '已确认' : status === 'cancelled' ? '已取消' : 'OFF');
                    } else {
                        isSelected = selectedSlots.some(s => s.date === d.iso && s.time === time);
                        slotClass = isSelected ? 'selected' : status;
                        displayText = status === 'available' ? '可预约' : status === 'pending' ? '待确认' : status === 'confirmed' ? '已确认' : status === 'cancelled' ? '已取消' : 'OFF';
                    }
                    html += `
                        <div class="slot ${slotClass}"
                             onclick="handleSlotClick('${d.iso}', '${time}', '${status}', ${dayIndex})">
                            ${displayText}
                        </div>
                    `;
                });
            });

            grid.innerHTML = html;
        }

        function handleSlotClick(dateIso, time, status, dayIndex) {
            if (status === 'off' || status === 'pending' || status === 'confirmed' || status === 'cancelled') return;
            if (recurringMode) {
                const dow = String(new Date(dateIso + 'T00:00:00').getDay());
                const idx = selectedSlots.findIndex(s => s.dow === dow && s.time === time);
                if (idx >= 0) {
                    selectedSlots.splice(idx, 1);
                } else {
                    selectedSlots.push({ coachId: currentCoachId, dow, time, dayLabel: getDayName(dayIndex) });
                }
                updateSelectedSlotsDisplay();
                renderSchedule();
                updateRecurPreview();
            } else {
                const idx = selectedSlots.findIndex(s => s.date === dateIso && s.time === time);
                if (idx >= 0) {
                    selectedSlots.splice(idx, 1);
                } else {
                    if (selectedSlots.length >= 4) { showStatus('最多只能选择4个时段', 'error'); return; }
                    const day = availability.days.find(d => d.iso === dateIso);
                    selectedSlots.push({ coachId: currentCoachId, date: dateIso, dateLabel: day ? day.date : dateIso, time });
                }
                updateSelectedSlotsDisplay();
                renderSchedule();
            }
        }

        function updateSelectedSlotsDisplay() {
            const container = document.getElementById('selectedSlots');
            const submitBtn = document.getElementById('submitBtn');
            if (selectedSlots.length === 0) {
                container.innerHTML = '<span style="color: #999; font-size: 0.9rem;">请在上方选择时段</span>';
                submitBtn.disabled = true;
                return;
            }
            if (recurringMode) {
                selectedSlots.sort((a, b) => (a.dow + a.time).localeCompare(b.dow + b.time));
                container.innerHTML = selectedSlots.map((slot, index) => {
                    const c = coaches.find(x => x.id === slot.coachId);
                    const name = c ? c.name : '';
                    const mv = document.getElementById('recurMonth').value;
                    const count = mv ? buildRecurSlotsFromSelected().filter(s => String(new Date(s.date+'T00:00:00').getDay())===slot.dow && s.time===slot.time).length : 0;
                    return `
                        <div class="selected-slot-tag">
                            ${name} 每${slot.dayLabel} ${slot.time} <span style="color:#667eea;">(${count}节)</span>
                            <span class="remove" onclick="removeSlot(${index})">×</span>
                        </div>
                    `;
                }).join('');
                submitBtn.disabled = false;
            } else {
                selectedSlots.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
                container.innerHTML = selectedSlots.map((slot, index) => {
                    const c = coaches.find(x => x.id === slot.coachId);
                    const name = c ? c.name : '';
                    return `
                        <div class="selected-slot-tag">
                            ${name} ${slot.dateLabel} ${slot.time}
                            <span class="remove" onclick="removeSlot(${index})">×</span>
                        </div>
                    `;
                }).join('');
                submitBtn.disabled = false;
            }
        }

        function removeSlot(index) {
            selectedSlots.splice(index, 1);
            updateSelectedSlotsDisplay();
            renderSchedule();
        }

        function initForm() {
            document.getElementById('submitBtn').addEventListener('click', submitBooking);
            initRecurring();
        }

        async function submitBooking() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { showStatus('请输入约课名', 'error'); return; }
            if (selectedSlots.length === 0) { showStatus('请至少选择一个时段', 'error'); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            showStatus('正在提交...', 'loading');

            const payload = {
                coachId: currentCoachId,
                name,
                slots: selectedSlots.map(s => ({ date: s.date, time: s.time }))
            };

            try {
                const res = await fetch(API_BASE + '/api/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || '提交失败');
                const c = coaches.find(x => x.id === currentCoachId);
                showStatus(`✅ 预约申请已提交！\n${c ? c.name : ''}教练会尽快确认。\n（你微信上也会收到通知）`, 'success');
                selectedSlots = [];
                updateSelectedSlotsDisplay();
                document.getElementById('nameInput').value = '';
                loadSchedule();
            } catch (error) {
                showStatus('提交失败：' + (error.message || '请稍后重试'), 'error');
                submitBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            statusEl.style.display = 'block';
            if (type === 'success') {
                setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
            }
        }
        // ── 整月循环预约 ──
        let recurringMode = false;
        let recurMonth = null;  // '2026-09' format
        function pad2(n){ return String(n).padStart(2,'0'); }
        function toMinLocal(t){ if(!t) return 0; const p=t.split(':').map(Number); return p[0]*60+p[1]; }
        function initRecurring(){
            populateRecurMonth();
            document.getElementById('recurMonth').addEventListener('change', updateRecurPreview);
            document.getElementById('recurSubmitBtn').addEventListener('click', submitRecurring);
        }
        // addRecurRule / renderRecurRules removed — grid-based selection now
        function populateRecurMonth(){
            const sel = document.getElementById('recurMonth');
            sel.innerHTML = '';
            const now = new Date();
            for(let i=0;i<6;i++){
                const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
                const val = d.getFullYear()+'-'+pad2(d.getMonth()+1);
                const lbl = d.getFullYear()+'年'+(d.getMonth()+1)+'月';
                sel.innerHTML += `<option value="${val}">${lbl}</option>`;
            }
        }
        function timeOptionsHtml(){
            let o='<option value=""></option>';
            for(let h=7;h<=23;h++){ for(const m of [0,30]){ const v=pad2(h)+':'+pad2(m); o+=`<option value="${v}">${v}</option>`; } }
            return o;
        }
        // populateRecurTimes removed
        function setMode(mode){
            recurringMode = (mode==='recur');
            document.getElementById('modeSingle').classList.toggle('active', !recurringMode);
            document.getElementById('modeRecur').classList.toggle('active', recurringMode);
            document.getElementById('scheduleContainer').style.display = '';
            document.getElementById('bookingForm').style.display = '';
            document.getElementById('recurringPanel').style.display = recurringMode ? '' : 'none';
            selectedSlots = [];
            updateSelectedSlotsDisplay();
            renderSchedule();
            if(recurringMode) updateRecurPreview();
        }
        function buildRecurSlotsFromSelected(){
            const mv = document.getElementById('recurMonth').value;
            if(!mv || selectedSlots.length===0) return [];
            const [y,m] = mv.split('-').map(Number);
            const slots=[];
            const days = new Date(y,m,0).getDate();
            for(let d=1; d<=days; d++){
                const dt = new Date(y,m-1,d);
                const dow = String(dt.getDay());
                for(const s of selectedSlots){
                    if(s.dow !== dow) continue;
                    slots.push({ date: y+'-'+pad2(m)+'-'+pad2(d), time: s.time });
                }
            }
            return slots;
        }
        function updateRecurPreview(){
            const pv = document.getElementById('recurPreview');
            const btn = document.getElementById('recurSubmitBtn');
            const mv = document.getElementById('recurMonth').value;
            if(!mv){ btn.disabled=true; pv.textContent='请选择月份'; pv.className='status-message'; return; }
            if(selectedSlots.length===0){ btn.disabled=true; pv.textContent='请在上方选择时段'; pv.className='status-message'; return; }
            const slots = buildRecurSlotsFromSelected();
            btn.disabled = slots.length===0;
            if(slots.length===0){ pv.textContent='该月份没有对应日期'; pv.className='status-message'; return; }
            const monthLbl = document.getElementById('recurMonth').selectedOptions[0].text;
            pv.innerHTML = `已选中 <b>${selectedSlots.length}</b> 个时段 → ${monthLbl} 共 <b>${slots.length}</b> 节课`;
            pv.className='status-message';
        }
        async function submitRecurring(){
            const name = document.getElementById('nameInput').value.trim();
            if(!name){ showStatus('请输入约课名','error'); return; }
            const slots = buildRecurSlotsFromSelected();
            if(slots.length===0){ showStatus('没有可预约的时段','error'); return; }
            const btn = document.getElementById('recurSubmitBtn');
            btn.disabled=true;
            showStatus('正在提交...','loading');
            try{
                const res = await fetch(API_BASE+'/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coachId:currentCoachId,name,slots})});
                const data = await res.json();
                if(!res.ok) throw new Error(data.error||'提交失败');
                const cnt = (data.pending?data.pending.length:slots.length);
                const skipped = (data.skipped||[]).length;
                showStatus(`✅ 已提交 ${cnt} 节循环课程！${skipped?`（${skipped} 节因教练未开放已跳过）`:''}`,'success');
                selectedSlots = [];
                updateSelectedSlotsDisplay();
                renderSchedule();
                updateRecurPreview();
            }catch(e){ showStatus('❌ '+e.message,'error'); btn.disabled=false; }
        }
        function showRecurStatus(msg,type){
            const el=document.getElementById('recurPreview');
            el.textContent=msg; el.className='status-message '+(type||''); el.style.display='block';
            if(type==='success'){ setTimeout(()=>{ el.style.display='none'; }, 5000); }
        }
    </script>
</body>
</html>
